[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clarity"
version = "0.1.0"
description = "A minimal, calm 2-pane goals & work manager for the terminal. No bloat, no backlogs. Just focus."
readme = "README.md"
authors = [{ name = "Omni" }]
dependencies = [
    "textual>=0.50.0",
]
requires-python = ">=3.9"

[project.scripts]
clarity = "goals.cli:main"
